name: Scrape La Bolita

on:
  schedule:
    - cron: '30,40,50 17 * * *'
    - cron: '0,10,20 18 * * *'
    - cron: '30,40,50 1 * * *'
    - cron: '0,10,20 2 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm install puppeteer

      - name: Leer resultados de labolitacubana.com
        run: node scraper.js

      - name: Guardar resultados.json en el repo
        run: |
          git config user.name "bolita-bot"
          git config user.email "bolita-bot@users.noreply.github.com"
          git add resultados.json
          git diff --staged --quiet || git commit -m "Actualiza resultados $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
